"chip gold\">Akademik<\u002Fspan><p class=\"mut\" style=\"margin:12px 0\">Susun arsitektur sistem yang kuat, rapi, dan siap tumbuh.<\u002Fp><p class=\"mut\" style=\"font-size:14px\">Format: [ISI] · Biaya: [ISI]<\u002Fp><a class=\"btn\" href=\"#daftar\" style=\"margin-top:16px\">Lihat detail<\u002Fa><\u002Farticle>\n<article class=\"card\"><div class=\"ico\" style=\"background:#C4F15A\"><svg width=\"30\" height=\"30\" aria-hidden=\"true\"><use href=\"#i-sh\" width=\"30\" height=\"30\"><\u002Fuse><\u002Fsvg><\u002Fdiv><h3 style=\"margin:16px 0 8px\">Esai Cyber Security<\u002Fh3><span class=\"chip gold\">Akademik<\u002Fspan><p class=\"mut\" style=\"margin:12px 0\">Tulis gagasanmu soal keamanan siber, tajam dan enak dibaca.<\u002Fp><p class=\"mut\" style=\"font-size:14px\">Format: [ISI] · Biaya: [ISI]<\u002Fp><a class=\"btn\" href=\"#daftar\" style=\"margin-top:16px\">Lihat detail<\u002Fa><\u002Farticle>\n<article class=\"card\"><div class=\"ico\" style=\"background:#F0A6F2\"><svg width=\"30\" height=\"30\" aria-hidden=\"true\"><use href=\"#i-net\" width=\"30\" height=\"30\"><\u002Fuse><\u002Fsvg><\u002Fdiv><h3 style=\"margin:16px 0 8px\">Machine Learning<\u002Fh3><span class=\"chip sky\">Non-akademik<\u002Fspan><p class=\"mut\" style=\"margin:12px 0\">Latih modelmu, kejar akurasi, dan buktikan di papan skor.<\u002Fp><p class=\"mut\" style=\"font-size:14px\">Format: [ISI] · Biaya: [ISI]<\u002Fp><a class=\"btn\" href=\"#daftar\" style=\"margin-top:16px\">Lihat detail<\u002Fa><\u002Farticle>\n<article class=\"card\"><div class=\"ico\" style=\"background:#9B6BF2\"><svg width=\"30\" height=\"30\" aria-hidden=\"true\"><use href=\"#i-pad\" width=\"30\" height=\"30\"><\u002Fuse><\u002Fsvg><\u002Fdiv><h3 style=\"margin:16px 0 8px\">PES<\u002Fh3><span class=\"chip sky\">Non-akademik<\u002Fspan><p class=\"mut\" style=\"margin:12px 0\">Adu strategi di lapangan hijau. Jempol boleh pegal, hati jangan.<\u002Fp><p class=\"mut\" style=\"font-size:14px\">Format: [ISI] · Biaya: [ISI]<\u002Fp><a class=\"btn\" href=\"#daftar\" style=\"margin-top:16px\">Lihat detail<\u002Fa><\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"jadwal\" class=\"w sec\">\n<h2>Tanggal penting, <span class=\"g\">jangan kelewat<\u002Fspan><\u002Fh2>\n<p class=\"mut\" style=\"margin:12px 0 32px;max-width:560px\">Tanggal di bawah hanya contoh. Jadwal sebenarnya diisi panitia.<\u002Fp>\n<div class=\"card\"><p style=\"font:800 22px 'Bricolage Grotesque',sans-serif;margin-bottom:16px\">[BULAN] [TAHUN]<\u002Fp>\n<div class=\"cal\" style=\"margin-bottom:6px\"><span class=\"hd\">Sen<\u002Fspan><span class=\"hd\">Sel<\u002Fspan><span class=\"hd\">Rab<\u002Fspan><span class=\"hd\">Kam<\u002Fspan><span class=\"hd\">Jum<\u002Fspan><span class=\"hd\">Sab<\u002Fspan><span class=\"hd\">Min<\u002Fspan><\u002Fdiv>\n<div class=\"cal\">\n<div class=\"d\">1<\u002Fdiv><div class=\"d\">2<\u002Fdiv><div class=\"d\">3<b class=\"s\" style=\"background:#F0A6F2\">Buka daftar<\u002Fb><\u002Fdiv><div class=\"d\">4<\u002Fdiv><div class=\"d\">5<\u002Fdiv><div class=\"d\">6<\u002Fdiv><div class=\"d\">7<\u002Fdiv>\n<div class=\"d\">8<\u002Fdiv><div class=\"d\">9<\u002Fdiv><div class=\"d\">10<b class=\"s\" style=\"background:#E6C978\">Tutup<\u002Fb><\u002Fdiv><div class=\"d\">11<\u002Fdiv><div class=\"d\">12<b class=\"s\" style=\"background:#6CC4FF\">Tech meeting<\u002Fb><\u002Fdiv><div class=\"d\">13<\u002Fdiv><div class=\"d\">14<\u002Fdiv>\n<div class=\"d\">15<\u002Fdiv><div class=\"d\">16<\u002Fdiv><div class=\"d\">17<\u002Fdiv><div class=\"d\">18<b class=\"s\" style=\"background:#9B6BF2\">Penyisihan<\u002Fb><\u002Fdiv><div class=\"d\">19<\u002Fdiv><div class=\"d\">20<\u002Fdiv><div class=\"d\">21<\u002Fdiv>\n<div class=\"d\">22<\u002Fdiv><div class=\"d\">23<\u002Fdiv><div class=\"d\">24<\u002Fdiv><div class=\"d\">25<b class=\"s\" style=\"background:#C4F15A\">Final<\u002Fb><\u002Fdiv><div class=\"d\">26<\u002Fdiv><div class=\"d\">27<b class=\"s\" style=\"background:#E6C978\">Juara<\u002Fb><\u002Fdiv><div class=\"d\">28<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"peringkat\" class=\"w sec\">\n<span class=\"chip lime\"><i class=\"dot\"><\u002Fi>Live<\u002Fspan>\n<h2 style=\"margin:12px 0\">Papan peringkat, <span class=\"g\">tanpa nunggu<\u002Fspan><\u002Fh2>\n<p class=\"mut\" style=\"margin-bottom:32px;max-width:560px\">Skor masuk, posisi langsung berubah. Kalau belum ada skor, papannya masih bersih dan siap diperebutkan.<\u002Fp>\n<div class=\"grid\" style=\"align-items:end\">\n<div class=\"card\" style=\"text-align:center\"><p class=\"num\" style=\"color:#C9C3E0\">2<\u002Fp><h3>Tim Contoh B<\u002Fh3><p class=\"mut\">Menunggu skor<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"text-align:center;padding-top:40px;padding-bottom:40px;border-color:#C9A04A\"><p class=\"num\" style=\"color:#E6C978;font-size:56px\">1<\u002Fp><h3>Tim Contoh A<\u002Fh3><p class=\"mut\">Menunggu skor<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"text-align:center\"><p class=\"num\" style=\"color:#D98A5B\">3<\u002Fp><h3>Tim Contoh C<\u002Fh3><p class=\"mut\">Menunggu skor<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"daftar\" class=\"w sec\">\n<h2>Daftar itu gampang, <span class=\"g\">empat langkah<\u002Fspan><\u002Fh2>\n<div class=\"grid\" style=\"margin-top:32px\">\n<div class=\"card\"><p class=\"num g\">1<\u002Fp><h3 style=\"margin:8px 0\">Buat akun<\u002Fh3><p class=\"mut\">Cukup data dasar, nggak sampai semenit.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><p class=\"num g\">2<\u002Fp><h3 style=\"margin:8px 0\">Pilih lomba<\u002Fh3><p class=\"mut\">Cabangnya ada di atas, tinggal tunjuk yang paling kamu banget.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><p class=\"num g\">3<\u002Fp><h3 style=\"margin:8px 0\">Isi tim dan berkas<\u002Fh3><p class=\"mut\">Syarat berkas muncul sesuai cabang yang kamu pilih.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><p class=\"num g\">4<\u002Fp><h3 style=\"margin:8px 0\">Bayar lewat QRIS<\u002Fh3><p class=\"mut\">Unggah bukti bayar, lalu panitia yang memverifikasi.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" class=\"w sec\" style=\"max-width:780px\">\n<h2 style=\"margin-bottom:24px\">Sering ditanya<\u002Fh2>\n<details><summary>Boleh daftar sendiri atau harus tim?<\u002Fsummary><p class=\"mut\">Tergantung cabangnya. Format tiap lomba ada di halaman detail.<\u002Fp><\u002Fdetails>\n<details><summary>Bayarnya gimana?<\u002Fsummary><p class=\"mut\">Lewat QRIS. Setelah daftar, kamu unggah bukti bayar dan panitia memverifikasi.<\u002Fp><\u002Fdetails>\n<details><summary>Berkas apa saja yang disiapkan?<\u002Fsummary><p class=\"mut\">Beda-beda per cabang. Daftarnya muncul saat kamu memilih lomba.<\u002Fp><\u002Fdetails>\n<\u002Fsection>\n\n<section class=\"w sec\"><div class=\"card\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px;padding:40px;background:linear-gradient(135deg,#241a57,#33113a)\">\n<svg sc-camel-view-box=\"0 0 400 360\" width=\"200\" aria-hidden=\"true\"><use href=\"#bf\"><\u002Fuse><\u002Fsvg>\n<div style=\"flex:1 1 300px\"><h2>Siap ikut <span class=\"g\">seru-seruan<\u002Fspan>?<\u002Fh2><p class=\"mut\" style=\"margin:12px 0 24px\">Kursi di arena terbatas, semangat nggak. Daftar sekarang sebelum pendaftaran ditutup.<\u002Fp><a class=\"btn p\" href=\"#daftar\">Daftar sekarang<\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<footer class=\"w\" style=\"padding-top:24px;padding-bottom:40px;border-top:1px solid #2E2266\"><p style=\"font-weight:700\">Permifest x Deforkafest<\u002Fp><p class=\"mut\" style=\"font-size:14px\">Permikomnas Yogyakarta x IMPSI UST Yogyakarta · Sosial media: [ISI]<\u002Fp><\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3900}}\">\nclass Component extends DCLogic {\nrenderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
